name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name for the draft release (e.g. v0.1.0). Leave blank to skip Release creation."
        required: false
        default: ""

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            assetNamePattern: ""
            includeUpdaterJson: true
          - name: macos-x64
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            assetNamePattern: ""
            includeUpdaterJson: true
          - name: linux-x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
            assetNamePattern: ""
            includeUpdaterJson: true
          - name: linux-arm64
            platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: ""
            assetNamePattern: ""
            includeUpdaterJson: true
          - name: windows-x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
            assetNamePattern: ""
            includeUpdaterJson: true
          - name: windows-x64-offline-webview2
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.windows-offline.conf.json
            assetNamePattern: "[name]_[version]_[platform]_[arch]_offline-webview2[setup][ext]"
            includeUpdaterJson: false

    runs-on: ${{ matrix.platform }}
    name: build (${{ matrix.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry & target
        if: runner.os != 'Windows'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & release with tauri-action
        if: steps.tag.outputs.publish == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: "Verdaccio Cache Manager ${{ steps.tag.outputs.name }}"
          releaseBody: |
            See the assets to download this version and install.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          assetNamePattern: ${{ matrix.assetNamePattern }}
          includeUpdaterJson: ${{ matrix.includeUpdaterJson }}

      - name: Build without publishing
        if: steps.tag.outputs.publish != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          assetNamePattern: ${{ matrix.assetNamePattern }}
          includeUpdaterJson: ${{ matrix.includeUpdaterJson }}

      - name: Upload artifacts (no-release runs)
        if: steps.tag.outputs.publish != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}-bundles
          path: |
            src-tauri/target/**/release/bundle/**/*
            !src-tauri/target/**/release/bundle/**/*.tmp
          if-no-files-found: warn
          retention-days: 7
